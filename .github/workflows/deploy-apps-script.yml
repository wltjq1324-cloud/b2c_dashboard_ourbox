# Apps Script 자동 배포
# main에 apps-script-v*.js 변경이 올라오면 가장 높은 버전 파일을 Code.js로 clasp push 하고
# 기존 웹앱 배포(DEPLOYMENT_ID)에 새 버전을 만듭니다. /exec URL은 그대로 유지됩니다.
#
# 1회 설정(README '자동 배포' 절 참조):
#   - 시크릿 CLASPRC_JSON : 로컬 `clasp login` 뒤 생기는 ~/.clasprc.json 내용 전체 (필수)
#   - .clasp.json 의 scriptId: Apps Script 프로젝트 설정 → 스크립트 ID (필수)
#   - 시크릿 DEPLOYMENT_ID : 보통 불필요. dashboard.src.html의 OURBOX_API_URL(/exec)에서 배포 ID를 읽고,
#                            그게 없으면 버전 있는 웹앱 배포가 1개일 때 자동 선택. 둘 다 아닐 때만 시크릿으로 지정.
#   - appsscript.json 은 라이브 프로젝트에서 clasp pull 로 받아 쓰므로 대조할 필요 없습니다.
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script-v*.js'
      - 'appsscript.json'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest apps-script-v*.js
        id: pick
        run: |
          set -euo pipefail
          FILE=$(ls apps-script-v*.js | sort -V | tail -1)
          if [ -z "$FILE" ]; then echo "apps-script-v*.js 파일이 없습니다"; exit 1; fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "선택: $FILE"

      - name: Check secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "$CLASPRC_JSON" ] && MISSING="$MISSING CLASPRC_JSON"
          SCRIPT_ID=$(python3 -c "import json;print(json.load(open('.clasp.json')).get('scriptId',''))")
          [ -z "$SCRIPT_ID" ] && MISSING="$MISSING .clasp.json:scriptId"
          if [ -n "$MISSING" ]; then
            echo "::error::설정이 비어 있어 배포를 건너뜁니다:$MISSING — README '자동 배포' 절을 따라 1회 설정하세요."
            exit 1
          fi

      - name: Stage build dir
        run: |
          set -euo pipefail
          rm -rf build && mkdir build
          # clasp는 .clasp.json이 가리키는 rootDir(build)만 올립니다.
          python3 - <<'PY'
          import json
          c = json.load(open('.clasp.json'))
          c['rootDir'] = 'build'
          json.dump(c, open('.clasp.json', 'w'), indent=2, ensure_ascii=False)
          PY
          ls -la build

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        # 사용자 PC의 clasp login 결과(~/.clasprc.json, tokens.default 형식)와 같은 메이저 버전이어야 읽힙니다.
        run: npm i -g @google/clasp@3

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          python3 -c "import json;json.load(open('$HOME/.clasprc.json'))" || { echo "::error::CLASPRC_JSON 이 올바른 JSON이 아닙니다"; exit 1; }

      - name: Pull live manifest (appsscript.json)
        run: |
          set -euo pipefail
          # 라이브 프로젝트의 파일을 그대로 받아 매니페스트는 유지하고 Code.js만 우리 것으로 바꿉니다.
          clasp pull
          ls -la build
          if [ ! -f build/appsscript.json ]; then
            echo "::warning::라이브 매니페스트를 받지 못해 저장소의 appsscript.json 을 사용합니다"
            cp appsscript.json build/appsscript.json
          fi
          # 편집기 파일명이 Code.gs 든 코드.gs 든 .js 로 내려오므로, .js 전부 지우고 우리 파일 하나만 둡니다
          find build -maxdepth 1 -name '*.js' -delete
          cp "${{ steps.pick.outputs.file }}" build/Code.js
          ls -la build

      - name: clasp push
        run: clasp push -f

      - name: Resolve deployment id
        id: dep
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"; echo "시크릿 DEPLOYMENT_ID 사용"; exit 0
          fi
          clasp --json deployments > deployments.json
          cat deployments.json
          # versionNumber가 없는 항목은 @HEAD(편집기 테스트 배포)라 제외
          IDS=$(python3 -c "import json;print('\n'.join(d['deploymentId'] for d in json.load(open('deployments.json')) if d.get('versionNumber')))")
          # 1순위: 대시보드가 실제로 호출하는 /exec URL의 배포 ID (dashboard.src.html의 window.OURBOX_API_URL).
          # 공개 HTML에 그대로 들어 있는 값이라 비밀이 아니며, 이 배포에 새 버전을 올려야 대시보드에 반영됩니다.
          FROM_SRC=$(sed -n 's#.*script\.google\.com/macros/s/\([A-Za-z0-9_-]\{20,\}\)/exec.*#\1#p' dashboard.src.html | head -1 || true)
          if [ -n "$FROM_SRC" ] && echo "$IDS" | grep -qx "$FROM_SRC"; then
            echo "id=$FROM_SRC" >> "$GITHUB_OUTPUT"; echo "dashboard.src.html의 OURBOX_API_URL 배포 ID 사용: $FROM_SRC"; exit 0
          fi
          [ -n "$FROM_SRC" ] && echo "::warning::dashboard.src.html의 배포 ID($FROM_SRC)가 이 스크립트의 배포 목록에 없습니다. .clasp.json의 scriptId가 대시보드 시트의 Apps Script가 맞는지 확인하세요."
          # 2순위: 버전이 있는 웹앱 배포가 하나뿐이면 그것
          COUNT=$(echo "$IDS" | grep -c . || true)
          if [ "$COUNT" -eq 1 ]; then
            echo "id=$IDS" >> "$GITHUB_OUTPUT"; echo "웹앱 배포 1개 자동 선택: $IDS"
          else
            echo "::error::웹앱 배포가 ${COUNT}개라 자동 선택할 수 없습니다. 위 목록에서 /exec URL에 쓰이는 배포 ID를 시크릿 DEPLOYMENT_ID 로 등록하세요."
            exit 1
          fi

      - name: clasp deploy (new version on existing deployment)
        run: |
          set -euo pipefail
          DESC="main ${GITHUB_SHA::7} · ${{ steps.pick.outputs.file }}"
          clasp deploy -i "${{ steps.dep.outputs.id }}" -d "$DESC" | tee deploy.log
          {
            echo "### Apps Script 배포 완료"
            echo "- 파일: \`${{ steps.pick.outputs.file }}\`"
            echo "- 설명: $DESC"
            echo '```'; cat deploy.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.clasprc.json
