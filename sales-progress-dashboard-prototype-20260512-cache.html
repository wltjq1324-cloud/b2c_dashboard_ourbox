<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아워박스 대시보드 이전 버전</title>
  <style>
    body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center}
    .card{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:22px 26px;box-shadow:0 8px 24px rgba(16,32,51,.06);text-align:center}
    .title{font-weight:900;margin-bottom:8px}.sub{font-size:13px;color:#687386}
  </style>
</head>
<body>
<div class="boot"><div class="card"><div class="title">이전 대시보드 로딩 중</div><div class="sub">루트 교체 전 버전을 불러옵니다.</div></div></div>
<script>
(async function(){
  const oldIndexUrl = 'https://raw.githubusercontent.com/wltjq1324-cloud/b2c_dashboard_ourbox/5342326d2fb8e36a8cf7dbb3af27cdbe6d6a1284/index.html';
  const response = await fetch(oldIndexUrl, { cache: 'no-store' });
  if(!response.ok) throw new Error('이전 버전 로드 실패: HTTP ' + response.status);
  const html = await response.text();
  document.open();
  document.write(html);
  document.close();
})().catch(function(err){
  document.body.innerHTML = '<div class="boot"><div class="card"><div class="title">이전 대시보드 로딩 실패</div><div class="sub">' + String(err.message || err).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}) + '</div></div></div>';
});
</script>
</body>
</html>
