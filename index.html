  document.body.innerHTML = '<div class="boot"><div class="card"><div class="title">Dashboard loading failed</div><div class="sub">' + String(err.message || err).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}) + '</div></div></div>';
});
</script>
</body>
</html>
